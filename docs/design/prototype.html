<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Graphtale – graph prototype voor/na</title>
<style>
/* Simulated VS Code theme variables */
body.dark{--vscode-editor-background:#1e1e1e;--vscode-foreground:#cccccc;--vscode-descriptionForeground:#9d9d9d;--vscode-panel-border:#3c3c3c;--vscode-editorWidget-background:#252526;--vscode-sideBar-background:#252526;--vscode-focusBorder:#007fd4;--vscode-charts-green:#89d185;--vscode-charts-yellow:#cca700;--vscode-charts-blue:#75beff;--vscode-charts-orange:#d18616;--vscode-charts-purple:#b180d7;--vscode-charts-red:#f14c4c;--vscode-disabledForeground:#8a8a8a}
body.light{--vscode-editor-background:#ffffff;--vscode-foreground:#3b3b3b;--vscode-descriptionForeground:#717171;--vscode-panel-border:#e5e5e5;--vscode-editorWidget-background:#f8f8f8;--vscode-sideBar-background:#f8f8f8;--vscode-focusBorder:#005fb8;--vscode-charts-green:#388a34;--vscode-charts-yellow:#bf8803;--vscode-charts-blue:#1a85ff;--vscode-charts-orange:#d18616;--vscode-charts-purple:#652d90;--vscode-charts-red:#e51400;--vscode-disabledForeground:#8a8a8a}
body.hc{--vscode-editor-background:#000;--vscode-foreground:#fff;--vscode-descriptionForeground:#fff;--vscode-panel-border:#6fc3df;--vscode-editorWidget-background:#0c141f;--vscode-sideBar-background:#000;--vscode-focusBorder:#f38518;--vscode-contrastBorder:#6fc3df;--vscode-charts-green:#89d185;--vscode-charts-yellow:#ffd700;--vscode-charts-blue:#75beff;--vscode-charts-orange:#f38518;--vscode-charts-purple:#b180d7;--vscode-disabledForeground:#a5a5a5}
html,body{margin:0;height:100%}
body{font-family:system-ui,sans-serif;background:var(--vscode-editor-background);color:var(--vscode-foreground)}
header{padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--vscode-panel-border)}
header h1{font-size:16px;margin:0 12px 0 0}header button{font:inherit;padding:5px 10px;border-radius:6px;border:1px solid var(--vscode-panel-border);background:var(--vscode-editorWidget-background);color:inherit;cursor:pointer}
header button.on{border-color:var(--vscode-focusBorder)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100% - 58px)}
body.single .wrap{grid-template-columns:1fr}body.single.show-after .pane.before,body.single.show-before .pane.after{display:none}
.pane{position:relative;overflow:auto;border-right:1px solid var(--vscode-panel-border)}
.pane h2{position:sticky;top:0;left:0;margin:0;padding:8px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--vscode-editor-background);z-index:5}
.canvas{position:relative;width:640px;height:560px;margin:10px}
.canvas > svg{position:absolute;inset:0;overflow:visible}
.canvas .node{position:absolute}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* ============ VOOR: exacte kopie van webview/styles.css (node/edge deel) ============ */
.before{--bg:var(--vscode-editor-background,#1e1e1e);--fg:var(--vscode-foreground,#ccc);--muted:var(--vscode-descriptionForeground,#9d9d9d);--border:var(--vscode-panel-border,#3c3c3c);--fill:var(--vscode-editorWidget-background,#252526);--elevated:var(--vscode-sideBar-background,#252526);--accent:var(--vscode-focusBorder,#007fd4);--edge:var(--vscode-charts-green,#89d185);--skill:var(--vscode-charts-yellow,#cca700);--agent:var(--vscode-charts-green,#3dc9a5);--reference:var(--vscode-charts-blue,#75beff);--script:var(--vscode-charts-orange,#d18616);--shared:var(--vscode-disabledForeground,#8a8a8a);--gate:var(--vscode-charts-blue,#75beff)}
.before .shape-mark{display:inline-block;width:10px;height:10px;flex-shrink:0;background:currentColor}
.before .shape-mark.shape-pill{width:16px;height:8px;border-radius:99px}.before .shape-mark.shape-rect{width:12px;height:10px;border-radius:2px}
.before .shape-mark.shape-hex{width:12px;height:11px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}.before .shape-mark.shape-diamond{transform:rotate(45deg)}
.before .shape-mark.kind-skill{color:var(--skill)}.before .shape-mark.kind-agent{color:var(--agent)}.before .shape-mark.kind-script{color:var(--script)}.before .shape-mark.kind-reference{color:var(--reference)}.before .shape-mark.kind-shared{color:var(--shared)}.before .shape-mark.kind-gate{color:var(--gate)}
.before .skill-node{position:relative;width:188px;min-height:68px;padding:10px 12px;border:1px solid currentColor;background:color-mix(in srgb,var(--elevated) 92%,var(--bg));color:var(--fg);letter-spacing:.01em;box-sizing:border-box;cursor:pointer}
.before .skill-node.shape-pill{border-radius:999px}.before .skill-node.shape-rect{border-radius:10px}
.before .skill-node.shape-hex{border-radius:12px;border-width:2px;background:color-mix(in srgb,var(--agent) 16%,var(--fill));box-shadow:inset 3px 0 0 var(--agent);min-width:168px}
.before .skill-node.shape-diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0}
.before .skill-node.kind-skill{border-color:var(--skill)}.before .skill-node.kind-agent{border-color:var(--agent);color:color-mix(in srgb,var(--fg) 92%,var(--agent))}.before .skill-node.kind-script{border-color:var(--script)}.before .skill-node.kind-reference{border-color:var(--reference)}.before .skill-node.kind-shared{border-color:var(--shared)}.before .skill-node.kind-gate{border-color:var(--gate)}
.before .skill-node.shape-diamond .skill-node-title,.before .skill-node.shape-diamond .skill-node-meta{padding-left:22px;padding-right:22px}
.before .skill-node.is-entry,.before .skill-node.is-selected{border-color:var(--accent);background:color-mix(in srgb,var(--fill) 80%,var(--bg));box-shadow:0 0 0 1px var(--accent)}
.before .skill-node.is-entry{font-weight:650;outline:1px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}
.before .skill-node.is-pending{border-style:dashed;border-color:var(--accent)}
.before .skill-node-body{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:46px}
.before .skill-node-title-row{display:flex;align-items:center;gap:6px;min-width:0}
.before .skill-node-title{flex:1;min-width:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.before .skill-node-meta{font-size:11px;color:var(--muted);padding-left:22px}
.before .agent-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--bg);background:var(--agent)}
.before .edge{stroke:var(--edge);stroke-width:1.5;fill:none}.before .edge.dashed{stroke:var(--muted);stroke-dasharray:5 4}
.before .edge.active{stroke:var(--accent)}

/* ============ NA: richting “Zachte stickers” ============ */
.after{--bg:var(--vscode-editor-background,#1e1e1e);--fg:var(--vscode-foreground,#ccc);--muted:var(--vscode-descriptionForeground,#9d9d9d);--border:var(--vscode-panel-border,#3c3c3c);--fill:var(--vscode-editorWidget-background,#252526);--accent:var(--vscode-focusBorder,#007fd4);
  /* warme tints bovenop themakleuren; elke kind een eigen kleur */
  --skill:color-mix(in srgb,var(--vscode-charts-orange,#d18616) 55%,var(--vscode-charts-yellow,#cca700));
  --agent:color-mix(in srgb,var(--vscode-charts-green,#89d185) 70%,var(--vscode-charts-blue,#75beff));
  --script:color-mix(in srgb,var(--vscode-charts-red,#f14c4c) 45%,var(--vscode-charts-orange,#d18616));
  --reference:var(--vscode-charts-blue,#75beff);
  --gate:var(--vscode-charts-purple,#b180d7);
  --shared:var(--vscode-disabledForeground,#8a8a8a);
  --edge:color-mix(in srgb,var(--muted) 65%,var(--bg));
  --halo:color-mix(in srgb,var(--k) 35%,transparent)}
.after .skill-node{--k:var(--shared);position:relative;width:188px;min-height:62px;padding:9px 12px 9px 9px;box-sizing:border-box;cursor:pointer;
  border:1.5px solid color-mix(in srgb,var(--k) 70%,transparent);
  background:color-mix(in srgb,var(--k) 13%,var(--fill));color:var(--fg);border-radius:16px;
  box-shadow:0 1px 0 color-mix(in srgb,var(--k) 25%,transparent),0 4px 12px -6px rgba(0,0,0,.35);
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.after .kind-skill{--k:var(--skill)}.after .kind-agent{--k:var(--agent)}.after .kind-script{--k:var(--script)}.after .kind-reference{--k:var(--reference)}.after .kind-gate{--k:var(--gate)}.after .kind-shared{--k:var(--shared)}
.after .skill-node.shape-pill{border-radius:999px}
.after .skill-node.shape-rect{border-radius:12px}
.after .skill-node.shape-hex{border-radius:22px 22px 22px 6px;border-width:2px}   /* agent = vriendelijke “tekstballon” */
.after .skill-node.shape-diamond{border-radius:14px;border-style:solid;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--k) 16%,var(--fill)) 0 8px,color-mix(in srgb,var(--k) 10%,var(--fill)) 8px 16px)} /* geen clip-path meer: rand blijft zichtbaar */
.after .skill-node:hover{transform:translateY(-1px);border-color:var(--k);box-shadow:0 0 0 3px var(--halo),0 8px 18px -8px rgba(0,0,0,.45)}
.after .skill-node.is-selected{border-color:var(--k);box-shadow:0 0 0 3px var(--halo),0 0 0 5px color-mix(in srgb,var(--k) 15%,transparent)}
.after .skill-node.is-entry::before{content:"start";position:absolute;top:-9px;left:16px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--k);color:var(--bg)}
.after .skill-node.is-entry{border-width:2px}
.after .skill-node.is-pending{border-style:dashed;opacity:.85}
.after .skill-node-body{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:42px}
.after .skill-node-title-row{display:flex;align-items:center;gap:8px;min-width:0}
.after .skill-node-title{flex:1;min-width:0;font-size:12.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.after .skill-node-meta{padding-left:34px;display:flex;gap:4px;flex-wrap:wrap}
.after .skill-node-meta .tag,.after .agent-badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--k) 22%,transparent);color:color-mix(in srgb,var(--fg) 80%,var(--k))}
.after .shape-mark{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--k);color:var(--bg)}
.after .shape-mark svg{width:15px;height:15px}
.after .edge{stroke:var(--edge);stroke-width:2;fill:none;stroke-linecap:round}
.after .edge.dashed{stroke-dasharray:2 6}
.after .edge.active{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.after .edge.active{animation:none}.after .skill-node{transition:none}}
/* high contrast: geen tints, duidelijke randen */
body.hc .after .skill-node{background:var(--bg);border-color:var(--vscode-contrastBorder);box-shadow:none}
body.hc .after .skill-node.is-selected,body.hc .after .skill-node:hover{outline:2px solid var(--accent);outline-offset:2px;box-shadow:none;transform:none}
</style></head>
<body class="dark">
<header><h1>Graphtale graph · voor/na</h1>
<span>Thema:</span><button data-theme="dark" class="on">Donker</button><button data-theme="light">Licht</button><button data-theme="hc">High contrast</button>
<span style="margin-left:12px">Weergave:</span><button data-view="side" class="on">Naast elkaar</button><button data-view="toggle">Toggle voor ⇄ na</button>
<small style="opacity:.7">Klik een node om te selecteren · hover voor state</small></header>
<div class="wrap">
<section class="pane before"><h2>Voor (huidige styles.css)</h2><div class="canvas"></div></section>
<section class="pane after"><h2>Na – “Zachte stickers”</h2><div class="canvas"></div></section>
</div>
<script>
const ICON={skill:'<path d="M8 1.5l1.7 4.3 4.3 1.7-4.3 1.7L8 13.5 6.3 9.2 2 7.5l4.3-1.7z" fill="currentColor"/>',
agent:'<rect x="2.5" y="4" width="11" height="9" rx="3.5" fill="currentColor"/><circle cx="6" cy="8.5" r="1.1" fill="var(--k)"/><circle cx="10" cy="8.5" r="1.1" fill="var(--k)"/><path d="M8 4V1.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
script:'<path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
reference:'<path d="M3 3h4a1.5 1.5 0 011.5 1.5V13 M13 3H9.5A1.5 1.5 0 008 4.5V13M3 3v9h4.5M13 3v9H8.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>',
gate:'<path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
shared:'<circle cx="5" cy="8" r="2.2" fill="currentColor"/><circle cx="11.5" cy="4.5" r="2" fill="currentColor"/><circle cx="11.5" cy="11.5" r="2" fill="currentColor"/>'};
const SHAPE={gate:'diamond',agent:'hex',script:'rect',skill:'pill',reference:'pill',shared:'pill'};
const LABEL={gate:'validation',skill:'skill',agent:'agent',script:'script',reference:'reference',shared:'shared'};
const N=[
{id:'a',kind:'skill',label:'analyse-ticket',x:220,y:10,uses:3,entry:true},
{id:'b',kind:'agent',label:'ticket-triager',x:20,y:130},
{id:'c',kind:'script',label:'fetch_ticket.sh',x:420,y:130},
{id:'d',kind:'gate',label:'has repro steps?',x:220,y:250},
{id:'e',kind:'reference',label:'severity-guide.md',x:20,y:380},
{id:'f',kind:'skill',label:'write-summary',x:420,y:380,uses:1,pending:true},
{id:'g',kind:'shared',label:'team-glossary',x:220,y:480}];
const E=[['a','b'],['a','c'],['b','d'],['c','d'],['d','e'],['d','f'],['f','g',1],['e','g',1]];
let sel='d';
function nodeHTML(n,after){
 const cls=['skill-node','kind-'+n.kind,'shape-'+SHAPE[n.kind],n.entry?'is-entry':'',n.pending?'is-pending':'',sel===n.id?'is-selected':''].join(' ');
 const mark=after?`<span class="shape-mark kind-${n.kind}"><svg viewBox="0 0 16 16">${ICON[n.kind]}</svg></span>`:`<span class="shape-mark kind-${n.kind} shape-${SHAPE[n.kind]}"></span>`;
 let meta;
 if(n.kind==='agent') meta='<span class="agent-badge">agent</span>';
 else if(after) meta=`<span class="tag">${LABEL[n.kind]}</span>`+(n.uses?`<span class="tag">${n.uses} uses</span>`:'')+(n.pending?'<span class="tag">pending</span>':'');
 else meta=LABEL[n.kind]+(n.uses?` · ${n.uses} uses`:'')+(n.pending?' · pending':'');
 return `<div class="node" style="left:${n.x}px;top:${n.y}px"><div class="${cls}" data-id="${n.id}"><div class="skill-node-body"><div class="skill-node-title-row">${mark}<div class="skill-node-title">${n.label}</div></div><div class="skill-node-meta">${meta}</div></div></div></div>`}
function edgePath(a,b,after){const x1=a.x+94,y1=a.y+64,x2=b.x+94,y2=b.y;
 if(!after) return `M${x1} ${y1} C${x1} ${(y1+y2)/2} ${x2} ${(y1+y2)/2} ${x2} ${y2}`;
 const my=(y1+y2)/2,r=Math.min(14,Math.abs(x2-x1)/2),s=Math.sign(x2-x1);
 if(!s) return `M${x1} ${y1} L${x2} ${y2}`;
 return `M${x1} ${y1} L${x1} ${my-r} Q${x1} ${my} ${x1+s*r} ${my} L${x2-s*r} ${my} Q${x2} ${my} ${x2} ${my+r} L${x2} ${y2}`}
function render(){document.querySelectorAll('.pane').forEach(p=>{const after=p.classList.contains('after');const by=Object.fromEntries(N.map(n=>[n.id,n]));
 const svg=`<svg width="640" height="560"><defs><marker id="ar${after}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="${after?7:6}" markerHeight="${after?7:6}" orient="auto"><path d="M0 0L10 5L0 10${after?'z':''}" fill="${after?'currentColor':'none'}" stroke="currentColor" stroke-width="${after?0:1.5}"/></marker></defs>`+
 E.map(([s,t,d])=>{const act=s===sel||t===sel;return `<path class="edge ${d?'dashed':''} ${act?'active':''}" d="${edgePath(by[s],by[t],after)}" marker-end="url(#ar${after})" style="color:${after?(act?'var(--accent)':'var(--edge)'):(act?'var(--accent)':'var(--edge)')}"/>`}).join('')+'</svg>';
 p.querySelector('.canvas').innerHTML=svg+N.map(n=>nodeHTML(n,after)).join('');})}
document.addEventListener('click',e=>{const n=e.target.closest('.skill-node');if(n){sel=n.dataset.id;render()}
 const t=e.target.dataset.theme;if(t){document.body.classList.remove('dark','light','hc');document.body.classList.add(t);document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b===e.target))}
 const v=e.target.dataset.view;if(v){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view==v));
  if(v==='side'){document.body.classList.remove('single','show-before','show-after')}else{const b=document.body;if(!b.classList.contains('single')){b.classList.add('single','show-after')}else{b.classList.toggle('show-after');b.classList.toggle('show-before')}}}});
render();
</script></body></html>
